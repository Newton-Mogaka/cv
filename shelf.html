<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bookshelf</title>
  <style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#2a1a0e;color:#f1e4cf;font-family:Georgia,serif}
h1{text-align:center;font-weight:normal;letter-spacing:2px;margin:24px 0 4px;font-size:22px}
#count{text-align:center;opacity:.6;font-size:13px;margin-bottom:16px}

/* View toggle */
#view-toggle{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
#view-toggle button{
  background:#0003;border:1px solid #fff3;color:#f1e4cf;padding:8px 16px;border-radius:4px;
  font:13px Georgia,serif;cursor:pointer;transition:all .15s
}
#view-toggle button:hover{background:#0005}
#view-toggle button.active{background:#8a5a3a;border-color:#d9ab74;color:#fff}

/* Shelf view (original) */
#shelf{max-width:860px;margin:0 auto 50px;padding:0 10px;
  background:linear-gradient(90deg,#4a2e1b,#8a5a3a 5%,#a06f48 50%,#8a5a3a 95%,#4a2e1b);
  border:8px solid #5a3a22;border-bottom:0;box-shadow:0 10px 40px #000}
.row{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:10px;align-items:end;
  padding:26px 6px 0;background:linear-gradient(#0006,#0000 50px)}
.plank{height:18px;margin:0 -10px;position:relative;
  background:linear-gradient(#d9ab74,#b98652 25%,#8a5a35 70%,#5e3a20);box-shadow:0 8px 14px #0009}
.plank::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,#0000 0 41px,#0002 41px 43px,#0000 43px 97px,#fff2 97px 98px)}
.book{position:relative;display:block;width:100%;aspect-ratio:2/3;border:0;padding:0;cursor:pointer;
  background:var(--c) center/cover no-repeat;box-shadow:0 2px 6px #000a,inset 2px 0 3px #fff3;
  transition:transform .18s;color:#f6ecd8}
.book:hover,.book:focus-visible{transform:translateY(-8px);outline:none}
.ph{display:flex;flex-direction:column;justify-content:center;height:100%;padding:10px 8px;
  font:600 clamp(11px,2.6vw,15px)/1.25 Georgia,serif;text-align:center;
  background:linear-gradient(90deg,#0005,#0000 12%),repeating-linear-gradient(0deg,#0000 0 6px,#fff1 6px 7px)}
.ph small{display:block;margin-top:8px;font-weight:normal;opacity:.75;font-size:.8em}
.has .ph{display:none}
.pct{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;
  background:#000a;color:#fff;font:600 11px/34px sans-serif;text-align:center;font-style:normal;
  box-shadow:0 0 0 2px #fff4}

/* Table view (hackerbooks style) */
#table-view{display:none;max-width:1100px;margin:0 auto;padding:0 16px}
#table-view.active{display:block}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
thead{position:sticky;top:0;z-index:10}
th{text-align:left;padding:10px 12px;background:#3a2618;color:#d9ab74;
  font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;
  border-bottom:2px solid #5a3a22;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #3a2618;vertical-align:middle}
tr:hover td{background:#3a2618}
tr.focused td{background:#4a2e1b;outline:2px solid #8a5a3a;outline-offset:-2px}
td.title{font-family:Georgia,serif;font-size:14px;max-width:380px}
td.title small{display:block;color:#b8956d;font-size:12px;margin-top:2px;font-style:italic}
td.author{color:#d4c4a8;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.progress{text-align:right;font-variant-numeric:tabular-nums}
td.status{text-align:center;white-space:nowrap}
.progress-bar{width:100px;height:6px;background:#3a2618;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.progress-fill{height:100%;background:linear-gradient(90deg,#8a5a3a,#d9ab74);border-radius:3px;transition:width .3s}
.status-badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.status-unread{background:#3a2618;color:#b8956d}
.status-reading{background:#1f3d5c;color:#7ab8e8}
.status-read{background:#2f4a2b;color:#7ed97e}
.status-dnf{background:#5a3b1e;color:#e8c47a}
.empty-row td{padding:40px;text-align:center;color:#8868a8}

/* Reader (unchanged) */
#reader{position:fixed;inset:0;z-index:50;background:#f4ecd8;color:#2a1a0c}
#reader[hidden]{display:none}
#bar{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(#6b4428,#4a2d19);color:#f3e9d2}
#bar button{background:#0003;color:inherit;border:1px solid #fff3;border-radius:4px;font-size:18px;padding:4px 12px;cursor:pointer}
#ttl{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#view{position:absolute;top:48px;bottom:0;left:0;right:0;overflow:auto;text-align:center}
#view canvas{max-width:100%}
#view{transition:left .2s}
#toc{position:absolute;top:48px;bottom:0;left:0;width:280px;max-width:85%;z-index:3;overflow:auto;
  background:#efe3c8;border-right:1px solid #0003;box-shadow:4px 0 14px #0004;
  transform:translateX(-100%);transition:transform .2s}
#reader.toc-open #toc{transform:none}
#toc button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #0001;
  padding:10px 12px;font:14px/1.3 Georgia,serif;color:#2a1a0c;cursor:pointer}
#toc button:hover{background:#e4d3ad}
#toc button.on{background:#d9c49a;font-weight:700}
#toc .empty{padding:14px;opacity:.7;font-size:14px}
@media(min-width:700px){#reader.toc-open #view{left:280px}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:6px;display:none;z-index:60}

/* Keyboard help modal */
#kbd-help{position:fixed;inset:0;z-index:100;background:#000c;display:none;align-items:center;justify-content:center}
#kbd-help[open]{display:flex}
.kbd-panel{background:#2a1a0e;border:2px solid #5a3a22;border-radius:8px;padding:24px;max-width:500px;width:90%;max-height:80vh;overflow:auto}
.kbd-panel h2{margin:0 0 16px;color:#d9ab74;font-weight:normal;letter-spacing:1px}
.kbd-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #3a2618;font-size:13px}
.kbd-row:last-child{border-bottom:none}
.kbd-key{background:#0003;border:1px solid #fff3;padding:2px 8px;border-radius:3px;font-family:ui-monospace,monospace;font-size:11px;color:#d9ab74}
  </style>
</head>
<body>
<h1>MY PERSONAL COLLECTION OF BOOKS</h1>
<div id="count"></div>

<!-- Search -->
<div id="search-wrap" style="max-width:860px;margin:0 auto 16px;padding:0 10px">
  <input type="search" id="search" placeholder="Search books…" aria-label="Search books"
    style="width:100%;padding:10px 14px;border:1px solid #5a3a22;border-radius:6px;background:#1a120a;color:#f1e4cf;font:14px Georgia,serif;outline:none;box-shadow:inset 0 2px 6px #0008">
</div>

<!-- View toggle -->
<div id="view-toggle">
  <button id="btn-shelf" class="active" data-view="shelf">Shelf</button>
  <button id="btn-table" data-view="table">Table</button>
</div>

<!-- Shelf view (original) -->
<div id="shelf"></div>

<!-- Table view (hackerbooks style) -->
<div id="table-view">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:40%">Title</th>
          <th style="width:25%">Author</th>
          <th style="width:20%">Progress</th>
          <th style="width:15%">Status</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<!-- Reader (unchanged) -->
<div id="reader" hidden>
  <div id="bar">
    <button id="tocbtn" aria-label="Contents" title="Contents">&#9776;</button>
    <button id="prev" aria-label="Previous">&lsaquo;</button>
    <button id="next" aria-label="Next">&rsaquo;</button>
    <span id="ttl"></span><span id="pos"></span>
    <button id="close" aria-label="Close">&times;</button>
  </div>
  <div id="toc"></div>
  <div id="view"></div>
</div>
<div id="toast"></div>

<!-- Keyboard help modal -->
<dialog id="kbd-help">
  <div class="kbd-panel">
    <h2>Keyboard Shortcuts</h2>
    <div class="kbd-row"><span>Navigation</span><span><kbd class="kbd-key">j</kbd> / <kbd class="kbd-key">k</kbd> — Next / Previous row</span></div>
    <div class="kbd-row"><span></span><span><kbd class="kbd-key">Enter</kbd> — Open book</span></div>
    <div class="kbd-row"><span></span><span><kbd class="kbd-key">g</kbd> <kbd class="kbd-key">s</kbd> — Shelf view | <kbd class="kbd-key">g</kbd> <kbd class="kbd-key">t</kbd> — Table view</span></div>
    <div class="kbd-row"><span></span><span><kbd class="kbd-key">/</kbd> — Focus search</span></div>
    <div class="kbd-row"><span>Reader</span><span><kbd class="kbd-key">←</kbd> / <kbd class="kbd-key">→</kbd> — Prev / Next page</span></div>
    <div class="kbd-row"><span></span><span><kbd class="kbd-key">Esc</kbd> — Close reader / Close modal</span></div>
    <div class="kbd-row"><span></span><span><kbd class="kbd-key">?</kbd> — Show this help</span></div>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const PAL = ['#7a1f1f','#1f3d5c','#2f4a2b','#5a3b1e','#3b2a52','#8a6a1c','#22454a','#6b2c3e'];
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&', '<': '<', '>': '>', '"': '"' }[c]));
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let books = [], currentView = 'shelf', tableFocusIndex = -1;
let filteredBooks = [], searchQuery = '';
let go = () => {}, cleanup = () => {}, relayout = () => {}, queue = Promise.resolve(), io = null;
let tocItems = [], tocPick = () => {};

function enableScrollNavigation(viewer, goFn) {
  const THRESHOLD = 80;
  let ticking = false;
  let lastScrollTop = 0;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const { scrollTop, scrollHeight, clientHeight } = viewer;
      const atBottom = scrollTop + clientHeight >= scrollHeight - THRESHOLD;
      const atTop = scrollTop <= THRESHOLD;
      if (atBottom) goFn(1);
      else if (atTop) goFn(-1);
      ticking = false;
    });
  }
  viewer.addEventListener('scroll', onScroll);
  return () => viewer.removeEventListener('scroll', onScroll);
}

fetch('books.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(t => {
    books = JSON.parse(t.replace(/^﻿/, ''));
    if (!Array.isArray(books)) throw new Error('books.json must be a list [ ... ]');
    render();
  })
  .catch(e => { console.error(e); $('#count').textContent = 'books.json: ' + e.message; });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });

function render() {
  filterBooks();
  $('#count').textContent = filteredBooks.length + ' of ' + books.length + ' books';
  if (currentView === 'shelf') renderShelf();
  else renderTable();
}

function filterBooks() {
  if (!searchQuery.trim()) {
    filteredBooks = books;
  } else {
    const q = searchQuery.toLowerCase();
    filteredBooks = books.filter(b =>
      b.title.toLowerCase().includes(q) ||
      (b.author && b.author.toLowerCase().includes(q))
    );
  }
  tableFocusIndex = -1;
}

function renderShelf() {
  const shelf = $('#shelf');
  const cols = Math.max(2, Math.min(6, Math.floor((shelf.clientWidth - 32 + 10) / 105)));
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    const b = filteredBooks[+e.target.dataset.i];
    queue = queue.then(() => makeCover(b)).then(u => setCover(e.target, u));
  }), { rootMargin: '200px' });

  let html = '';
  for (let i = 0; i < filteredBooks.length; i += cols) {
    html += `<div class="row" style="--cols:${cols}">` +
      filteredBooks.slice(i, i + cols).map((b, j) => card(b, i + j)).join('') + '</div><div class="plank"></div>';
  }
  shelf.innerHTML = html;
  shelf.querySelectorAll('.book').forEach(el => {
    const b = filteredBooks[+el.dataset.i];
    const cached = b.cover || store.get('cov:' + b.file);
    if (cached) setCover(el, cached); else if (b.file) io.observe(el);
  });
  $('#shelf').style.display = 'block';
  $('#table-view').classList.remove('active');
}

function card(b, i) {
  const pct = +store.get('pct:' + b.file) || 0;
  const c = b.color || PAL[hash(b.title) % PAL.length];
  return `<button class="book" data-i="${i}" style="--c:${c}" title="${esc(b.title)}">
    <span class="ph">${esc(b.title)}${b.author ? '<small>' + esc(b.author) + '</small>' : ''}</span>
    ${pct ? `<i class="pct">${pct}%</i>` : ''}</button>`;
}

function setCover(el, url) {
  if (!url) return;
  el.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
  el.classList.add('has');
}

async function makeCover(b) {
  try {
    let url = null;
    if (b.file.toLowerCase().endsWith('.pdf')) {
      const doc = await pdfjsLib.getDocument(b.file).promise;
      const p = await doc.getPage(1), v0 = p.getViewport({ scale: 1 });
      const v = p.getViewport({ scale: 300 / v0.width });
      const c = document.createElement('canvas'); c.width = v.width; c.height = v.height;
      await p.render({ canvasContext: c.getContext('2d'), viewport: v }).promise;
      url = c.toDataURL('image/jpeg', .75);
      doc.destroy();
    } else {
      const bk = ePub(b.file, { openAs: 'epub' });
      const u = await bk.coverUrl();
      if (u) url = await shrink(u);
      bk.destroy();
    }
    if (url) store.set('cov:' + b.file, url);
    return url;
  } catch (e) { console.warn('cover failed', b.file, e); return null; }
}
function shrink(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas');
      c.width = 300; c.height = Math.round(300 * im.height / im.width);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', .75));
    };
    im.onerror = rej; im.src = src;
  });
}

// Table view rendering
function renderTable() {
  const tbody = $('#table-body');
  tbody.innerHTML = filteredBooks.map((b, i) => tableRow(b, i)).join('') || '<tr class="empty-row"><td colspan="4">No books match your search</td></tr>';
  $('#shelf').style.display = 'none';
  $('#table-view').classList.add('active');
  // Reset focus
  tableFocusIndex = -1;
  updateTableFocus();
}

function tableRow(b, i) {
  const pct = +store.get('pct:' + b.file) || 0;
  let status = 'unread', statusLabel = 'Unread';
  if (pct === 100) { status = 'read'; statusLabel = 'Read'; }
  else if (pct > 0) { status = 'reading'; statusLabel = 'Reading'; }
  // Could add DNF detection later
  return `<tr data-index="${i}">
    <td class="title">${esc(b.title)}<small>${esc(b.author || 'Unknown author')}</small></td>
    <td class="author">${esc(b.author || 'Unknown')}</td>
    <td class="progress">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span style="margin-left:8px;font-variant-numeric:tabular-nums">${pct}%</span>
    </td>
    <td class="status"><span class="status-badge status-${status}">${statusLabel}</span></td>
  </tr>`;
}

function updateTableFocus() {
  $$('#table-body tr[data-index]').forEach((tr, idx) => {
    tr.classList.toggle('focused', idx === tableFocusIndex);
  });
  // Scroll into view if focused
  if (tableFocusIndex >= 0) {
    const tr = $('#table-body tr[data-index="' + tableFocusIndex + '"]');
    if (tr) tr.scrollIntoView({ block: 'nearest' });
  }
}

// View switching
function setView(view) {
  currentView = view;
  $('#btn-shelf').classList.toggle('active', view === 'shelf');
  $('#btn-table').classList.toggle('active', view === 'table');
  render();
}

$('#btn-shelf').onclick = () => setView('shelf');
$('#btn-table').onclick = () => setView('table');

$('#shelf').addEventListener('click', e => {
  const el = e.target.closest('.book'); if (!el) return;
  const b = filteredBooks[+el.dataset.i];
  if (!b.file) return toast('Not available to read online');
  if (isAiBook(b)) {
    showDownloadModal(b);
  } else {
    openBook(b);
  }
});

$('#table-body').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-index]'); if (!tr) return;
  const b = filteredBooks[+tr.dataset.index];
  if (!b.file) return toast('Not available to read online');
  if (isAiBook(b)) {
    showDownloadModal(b);
  } else {
    openBook(b);
  }
});

// Check if book is the AI Modern Approach book
function isAiBook(b) {
  return b.title.includes('Artificial Intelligence - A Modern Approach');
}

// Show download modal for AI book
function showDownloadModal(b) {
  const modal = document.createElement('div');
  modal.id = 'download-modal';
  modal.style.cssText = `
    position:fixed;inset:0;z-index:100;background:#000c;
    display:flex;align-items:center;justify-content:center;
  `;
  modal.innerHTML = `
    <div style="background:#2a1a0e;border:2px solid #5a3a22;border-radius:8px;padding:32px;max-width:400px;width:90%;text-align:center">
      <h2 style="margin:0 0 16px;color:#d9ab74;font-weight:normal;letter-spacing:1px">${esc(b.title)}</h2>
      <p style="color:#f1e4cf;margin-bottom:24px;font-size:14px;line-height:1.5">
        This book is available for download.
      </p>
      <button id="download-btn" style="
        background:linear-gradient(90deg,#8a5a3a,#d9ab74);
        border:none;color:#fff;padding:12px 28px;border-radius:4px;
        font:600 14px Georgia,serif;cursor:pointer;letter-spacing:.5px;
        transition:transform .15s,box-shadow .15s;
      ">Download Book</button>
      <button id="cancel-download" style="
        background:transparent;border:1px solid #5a3a22;color:#b8956d;
        padding:10px 20px;border-radius:4px;font:14px Georgia,serif;cursor:pointer;
        margin-top:12px;display:block;width:100%;
      ">Cancel</button>
    </div>
  `;
  document.body.appendChild(modal);

  $('#download-btn').onclick = () => {
    modal.remove();
    triggerDownload(b);
  };
  $('#cancel-download').onclick = () => modal.remove();
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
}

// Trigger the actual download
function triggerDownload(b) {
  // Create download page with message
  const downloadPage = window.open('', '_blank');
  downloadPage.document.write(`
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Downloading...</title>
      <style>
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;background:#2a1a0e;color:#f1e4cf;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
        h1{font-weight:normal;letter-spacing:2px;margin-bottom:8px;font-size:clamp(24px,5vw,36px)}
        p{font-size:clamp(16px,3vw,20px);max-width:600px;line-height:1.6}
        .emoji{font-size:2em;margin-top:16px}
        .progress{margin-top:32px;width:100%;max-width:400px;height:8px;background:#3a2618;border-radius:4px;overflow:hidden}
        .progress-fill{height:100%;background:linear-gradient(90deg,#8a5a3a,#d9ab74);border-radius:4px;width:0%;animation:fill 2s ease-out forwards}
        @keyframes fill{to{width:100%}}
      </style>
    </head>
    <body>
      <h1>Hello. Vanessa</h1>
      <p>Your book is Downloading. Leave a thumbs up! 👍</p>
      <div class="progress"><div class="progress-fill"></div></div>
    </body>
    </html>
  `);
  downloadPage.document.close();

  // Trigger the actual file download
  const a = document.createElement('a');
  a.href = b.file;
  a.download = b.file.split('/').pop();
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// Keyboard shortcuts
let gSequence = false;
addEventListener('keydown', e => {
  // Global shortcuts
  if (e.key === '?') {
    e.preventDefault();
    $('#kbd-help').showModal();
    return;
  }
  if (e.key === 'Escape') {
    if (!$('#reader').hidden) { closeReader(); return; }
    if ($('#kbd-help').open) { $('#kbd-help').close(); return; }
    const downloadModal = $('#download-modal');
    if (downloadModal) { downloadModal.remove(); return; }
  }
  if (e.key === '/') {
    e.preventDefault();
    // Future: focus search input
    return;
  }
  // g-sequence: g s / g t
  if (gSequence) {
    if (e.key === 's') { e.preventDefault(); setView('shelf'); }
    else if (e.key === 't') { e.preventDefault(); setView('table'); }
    gSequence = false;
    return;
  }
  if (e.key === 'g') { gSequence = true; return; }

  // Table navigation
  if (currentView === 'table' && !$('#reader').hidden === false) {
    if (e.key === 'j') { e.preventDefault(); tableFocusIndex = Math.min(tableFocusIndex + 1, filteredBooks.length - 1); updateTableFocus(); }
    else if (e.key === 'k') { e.preventDefault(); tableFocusIndex = Math.max(tableFocusIndex - 1, 0); updateTableFocus(); }
    else if (e.key === 'Enter' && tableFocusIndex >= 0) {
      e.preventDefault();
      const b = filteredBooks[tableFocusIndex];
      if (b.file) {
        if (isAiBook(b)) {
          showDownloadModal(b);
        } else {
          openBook(b);
        }
      } else {
        toast('Not available to read online');
      }
    }
  }

  // Reader shortcuts
  if (!$('#reader').hidden) {
    if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'Escape') closeReader();
  }
});

// Search functionality
$('#search').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

// Focus search on '/' key (when not in reader or modal)
addEventListener('keydown', e => {
  if (e.key === '/' && $('#reader').hidden && !$('#kbd-help').open && document.activeElement !== $('#search')) {
    e.preventDefault();
    $('#search').focus();
  }
});

function toast(m) {
  const el = $('#toast'); el.textContent = m; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2000);
}

function showToc(items, onPick) {
  tocItems = items; tocPick = onPick || (() => {});
  $('#toc').innerHTML = items.length
    ? items.map((it, i) => `<button data-i="${i}" style="padding-left:${12 + it.depth * 14}px">${esc((it.label || '(untitled)').trim())}</button>`).join('')
    : '<p class="empty">No table of contents in this book.</p>';
}
function markToc(i) {
  $('#toc').querySelectorAll('button').forEach((el, j) => {
    el.classList.toggle('on', j === i);
    if (j === i) el.scrollIntoView({ block: 'nearest' });
  });
}
function setToc(open) {
  $('#reader').classList.toggle('toc-open', open);
  setTimeout(() => relayout(), 230);
}
$('#tocbtn').onclick = () => setToc(!$('#reader').classList.contains('toc-open'));
$('#toc').addEventListener('click', e => {
  const el = e.target.closest('button'); if (!el) return;
  tocPick(tocItems[+el.dataset.i]);
  if (innerWidth < 700) setToc(false);
});

async function openBook(b) {
  $('#reader').hidden = false; $('#ttl').textContent = b.title; $('#pos').textContent = '';
  tocItems = []; $('#toc').innerHTML = '<p class="empty">Loading&hellip;</p>';
  $('#reader').classList.toggle('toc-open', innerWidth >= 700);
  document.body.style.overflow = 'hidden';
  try {
    if (b.file.toLowerCase().endsWith('.pdf')) await openPdf(b); else await openEpub(b);
  } catch (err) { console.error(err); $('#view').textContent = 'Could not open this book.'; }
}

async function openEpub(b) {
  const book = ePub(b.file, { openAs: 'epub' });
  const r = book.renderTo('view', { width: '100%', height: '100%', flow: 'paginated', spread: 'none' });
  const key = 'pos:' + b.file;
  const base = h => String(h || '').split('#')[0];
  const upd = l => {
    if (l && l.start && book.locations.length())
      store.set('pct:' + b.file, Math.round(book.locations.percentageFromCfi(l.start.cfi) * 100));
  };
  const mark = l => {
    if (!l || !l.start) return;
    const h = base(l.start.href);
    const i = tocItems.findIndex(t => t.key && (base(t.key).endsWith(h) || h.endsWith(base(t.key))));
    if (i >= 0) markToc(i);
  };
  book.loaded.navigation.then(nav => {
    const flat = [];
    const walk = (a, d) => (a || []).forEach(t => {
      flat.push({ label: t.label, depth: d, key: t.href });
      walk(t.subitems, d + 1);
    });
    walk(nav.toc, 0);
    showToc(flat, it => r.display(it.key));
    mark(r.currentLocation());
  }).catch(() => showToc([]));
  await r.display(store.get(key) || undefined);
  r.on('relocated', l => { store.set(key, l.start.cfi); upd(l); mark(l); });
  book.ready.then(() => book.locations.generate(1200)).then(() => upd(r.currentLocation())).catch(() => {});
  go = d => d > 0 ? r.next() : r.prev();
  relayout = () => r.resize();
  cleanup = () => {
    book.destroy();
    if (window._scrollRemove) { window._scrollRemove(); window._scrollRemove = null; }
  };
  const removeScroll = enableScrollNavigation($('#view'), go);
  window._scrollRemove = removeScroll;
}

async function pdfToc(doc) {
  const out = await doc.getOutline();
  const items = [];
  const walk = async (list, d) => {
    for (const o of list) {
      let page = null;
      try {
        let dest = o.dest;
        if (typeof dest === 'string') dest = await doc.getDestination(dest);
        if (Array.isArray(dest)) page = typeof dest[0] === 'object' ? (await doc.getPageIndex(dest[0])) + 1 : dest[0] + 1;
      } catch (e) {}
      items.push({ label: o.title, depth: d, key: page });
      if (o.items && o.items.length) await walk(o.items, d + 1);
    }
  };
  if (out) await walk(out, 0);
  return items;
}

async function openPdf(b) {
  const doc = await pdfjsLib.getDocument(b.file).promise;
  const key = 'pos:' + b.file, view = $('#view');
  let n = Math.min(doc.numPages, +store.get(key) || 1);
  const canvas = document.createElement('canvas'); view.appendChild(canvas);
  const markPdf = () => {
    let idx = -1;
    tocItems.forEach((t, i) => { if (t.key && t.key <= n) idx = i; });
    if (idx >= 0) markToc(idx);
  };
  const draw = async () => {
    const p = await doc.getPage(n), dpr = devicePixelRatio || 1;
    const base = p.getViewport({ scale: 1 });
    const v = p.getViewport({ scale: Math.min(view.clientWidth / base.width, 1.6) * dpr });
    canvas.width = v.width; canvas.height = v.height;
    canvas.style.width = v.width / dpr + 'px';
    await p.render({ canvasContext: canvas.getContext('2d'), viewport: v }).promise;
    $('#pos').textContent = n + ' / ' + doc.numPages;
    view.scrollTop = 0;
    store.set(key, n); store.set('pct:' + b.file, Math.round(n / doc.numPages * 100));
    markPdf();
  };
  go = d => { n = Math.max(1, Math.min(doc.numPages, n + d)); draw(); };
  relayout = () => draw();
  cleanup = () => {
    doc.destroy();
    if (window._scrollRemove) { window._scrollRemove(); window._scrollRemove = null; }
  };
  pdfToc(doc).then(items => {
    showToc(items, it => { if (it.key) { n = it.key; draw(); } });
    markPdf();
  }).catch(() => showToc([]));
  await draw();
  const removeScroll = enableScrollNavigation(view, go);
  window._scrollRemove = removeScroll;
}

function closeReader() {
  cleanup(); cleanup = () => {}; go = () => {}; relayout = () => {}; tocItems = [];
  if (window._scrollRemove) { window._scrollRemove(); window._scrollRemove = null; }
  $('#view').innerHTML = ''; $('#reader').hidden = true;
  document.body.style.overflow = '';
  render();   // refresh progress badges
}
$('#close').onclick = closeReader;
$('#next').onclick = () => go(1);
$('#prev').onclick = () => go(-1);
</script>
</body>
