<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookshelf</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#2a1a0e;color:#f1e4cf;font-family:Georgia,serif}
h1{text-align:center;font-weight:normal;letter-spacing:2px;margin:24px 0 4px;font-size:22px}
#count{text-align:center;opacity:.6;font-size:13px;margin-bottom:16px}
#shelf{max-width:860px;margin:0 auto 50px;padding:0 10px;
  background:linear-gradient(90deg,#4a2e1b,#8a5a3a 5%,#a06f48 50%,#8a5a3a 95%,#4a2e1b);
  border:8px solid #5a3a22;border-bottom:0;box-shadow:0 10px 40px #000}
.row{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:10px;align-items:end;
  padding:26px 6px 0;background:linear-gradient(#0006,#0000 50px)}
.plank{height:18px;margin:0 -10px;position:relative;
  background:linear-gradient(#d9ab74,#b98652 25%,#8a5a35 70%,#5e3a20);box-shadow:0 8px 14px #0009}
.plank::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,#0000 0 41px,#0002 41px 43px,#0000 43px 97px,#fff2 97px 98px)}
.book{position:relative;display:block;width:100%;aspect-ratio:2/3;border:0;padding:0;cursor:pointer;
  background:var(--c) center/cover no-repeat;box-shadow:0 2px 6px #000a,inset 2px 0 3px #fff3;
  transition:transform .18s;color:#f6ecd8}
.book:hover,.book:focus-visible{transform:translateY(-8px);outline:none}
.ph{display:flex;flex-direction:column;justify-content:center;height:100%;padding:10px 8px;
  font:600 clamp(11px,2.6vw,15px)/1.25 Georgia,serif;text-align:center;
  background:linear-gradient(90deg,#0005,#0000 12%),repeating-linear-gradient(0deg,#0000 0 6px,#fff1 6px 7px)}
.ph small{display:block;margin-top:8px;font-weight:normal;opacity:.75;font-size:.8em}
.has .ph{display:none}
.pct{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;
  background:#000a;color:#fff;font:600 11px/34px sans-serif;text-align:center;font-style:normal;
  box-shadow:0 0 0 2px #fff4}
#reader{position:fixed;inset:0;z-index:50;background:#f4ecd8;color:#2a1a0c}
#reader[hidden]{display:none}
#bar{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(#6b4428,#4a2d19);color:#f3e9d2}
#bar button{background:#0003;color:inherit;border:1px solid #fff3;border-radius:4px;font-size:18px;padding:4px 12px;cursor:pointer}
#ttl{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#view{position:absolute;top:48px;bottom:0;left:0;right:0;overflow:auto;text-align:center}
#view canvas{max-width:100%}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:6px;display:none;z-index:60}
</style>
</head>
<body>
<h1>BOOKS I'VE READ</h1>
<div id="count"></div>
<div id="shelf"></div>

<div id="reader" hidden>
  <div id="bar">
    <button id="prev" aria-label="Previous">&lsaquo;</button>
    <button id="next" aria-label="Next">&rsaquo;</button>
    <span id="ttl"></span><span id="pos"></span>
    <button id="close" aria-label="Close">&times;</button>
  </div>
  <div id="view"></div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const PAL = ['#7a1f1f','#1f3d5c','#2f4a2b','#5a3b1e','#3b2a52','#8a6a1c','#22454a','#6b2c3e'];
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let books = [], go = () => {}, cleanup = () => {}, queue = Promise.resolve(), io = null;

fetch('books.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(t => {
    books = JSON.parse(t.replace(/^\uFEFF/, ''));
    if (!Array.isArray(books)) throw new Error('books.json must be a list [ ... ]');
    render();
  })
  .catch(e => { console.error(e); $('#count').textContent = 'books.json: ' + e.message; });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });

function render() {
  const shelf = $('#shelf');
  const cols = Math.max(2, Math.min(6, Math.floor((shelf.clientWidth - 32 + 10) / 105)));
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    const b = books[+e.target.dataset.i];
    queue = queue.then(() => makeCover(b)).then(u => setCover(e.target, u));
  }), { rootMargin: '200px' });

  let html = '';
  for (let i = 0; i < books.length; i += cols) {
    html += `<div class="row" style="--cols:${cols}">` +
      books.slice(i, i + cols).map((b, j) => card(b, i + j)).join('') + '</div><div class="plank"></div>';
  }
  shelf.innerHTML = html;
  shelf.querySelectorAll('.book').forEach(el => {
    const b = books[+el.dataset.i];
    const cached = b.cover || store.get('cov:' + b.file);
    if (cached) setCover(el, cached); else if (b.file) io.observe(el);
  });
  $('#count').textContent = books.length + ' books';
}

function card(b, i) {
  const pct = +store.get('pct:' + b.file) || 0;
  const c = b.color || PAL[hash(b.title) % PAL.length];
  return `<button class="book" data-i="${i}" style="--c:${c}" title="${esc(b.title)}">
    <span class="ph">${esc(b.title)}${b.author ? '<small>' + esc(b.author) + '</small>' : ''}</span>
    ${pct ? `<i class="pct">${pct}%</i>` : ''}</button>`;
}

function setCover(el, url) {
  if (!url) return;
  el.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
  el.classList.add('has');
}

// Cover: the "cover" field in books.json, else page 1 of a PDF / the cover of an EPUB (cached in this browser)
async function makeCover(b) {
  try {
    let url = null;
    if (b.file.toLowerCase().endsWith('.pdf')) {
      const doc = await pdfjsLib.getDocument(b.file).promise;
      const p = await doc.getPage(1), v0 = p.getViewport({ scale: 1 });
      const v = p.getViewport({ scale: 300 / v0.width });
      const c = document.createElement('canvas'); c.width = v.width; c.height = v.height;
      await p.render({ canvasContext: c.getContext('2d'), viewport: v }).promise;
      url = c.toDataURL('image/jpeg', .75);
      doc.destroy();
    } else {
      const bk = ePub(b.file, { openAs: 'epub' });
      const u = await bk.coverUrl();
      if (u) url = await shrink(u);
      bk.destroy();
    }
    if (url) store.set('cov:' + b.file, url);
    return url;
  } catch (e) { console.warn('cover failed', b.file, e); return null; }
}
function shrink(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas');
      c.width = 300; c.height = Math.round(300 * im.height / im.width);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', .75));
    };
    im.onerror = rej; im.src = src;
  });
}

$('#shelf').addEventListener('click', e => {
  const el = e.target.closest('.book'); if (!el) return;
  const b = books[+el.dataset.i];
  if (!b.file) return toast('Not available to read online');
  openBook(b);
});
function toast(m) {
  const el = $('#toast'); el.textContent = m; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2000);
}

async function openBook(b) {
  $('#reader').hidden = false; $('#ttl').textContent = b.title; $('#pos').textContent = '';
  document.body.style.overflow = 'hidden';
  try {
    if (b.file.toLowerCase().endsWith('.pdf')) await openPdf(b); else await openEpub(b);
  } catch (err) { console.error(err); $('#view').textContent = 'Could not open this book.'; }
}

async function openEpub(b) {
  const book = ePub(b.file, { openAs: 'epub' });
  const r = book.renderTo('view', { width: '100%', height: '100%', flow: 'paginated', spread: 'none' });
  const key = 'pos:' + b.file;
  const upd = l => {
    if (l && l.start && book.locations.length())
      store.set('pct:' + b.file, Math.round(book.locations.percentageFromCfi(l.start.cfi) * 100));
  };
  await r.display(store.get(key) || undefined);
  r.on('relocated', l => { store.set(key, l.start.cfi); upd(l); });
  book.ready.then(() => book.locations.generate(1200)).then(() => upd(r.currentLocation())).catch(() => {});
  go = d => d > 0 ? r.next() : r.prev();
  cleanup = () => book.destroy();
}

async function openPdf(b) {
  const doc = await pdfjsLib.getDocument(b.file).promise;
  const key = 'pos:' + b.file, view = $('#view');
  let n = Math.min(doc.numPages, +store.get(key) || 1);
  const canvas = document.createElement('canvas'); view.appendChild(canvas);
  const draw = async () => {
    const p = await doc.getPage(n), dpr = devicePixelRatio || 1;
    const base = p.getViewport({ scale: 1 });
    const v = p.getViewport({ scale: Math.min(view.clientWidth / base.width, 1.6) * dpr });
    canvas.width = v.width; canvas.height = v.height;
    canvas.style.width = v.width / dpr + 'px';
    await p.render({ canvasContext: canvas.getContext('2d'), viewport: v }).promise;
    $('#pos').textContent = n + ' / ' + doc.numPages;
    view.scrollTop = 0;
    store.set(key, n); store.set('pct:' + b.file, Math.round(n / doc.numPages * 100));
  };
  go = d => { n = Math.max(1, Math.min(doc.numPages, n + d)); draw(); };
  cleanup = () => doc.destroy();
  await draw();
}

function closeReader() {
  cleanup(); cleanup = () => {}; go = () => {};
  $('#view').innerHTML = ''; $('#reader').hidden = true;
  document.body.style.overflow = '';
  render();   // refresh progress badges
}
$('#close').onclick = closeReader;
$('#next').onclick = () => go(1);
$('#prev').onclick = () => go(-1);
addEventListener('keydown', e => {
  if ($('#reader').hidden) return;
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'Escape') closeReader();
});
</script>
</body>
</html>
