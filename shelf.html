<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookshelf</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#150d07;color:#e8dcc8;font-family:Georgia,serif}
h1{text-align:center;font-weight:normal;letter-spacing:2px;margin:28px 0 6px}
#count{text-align:center;opacity:.6;font-size:14px;margin-bottom:20px}
#shelf{max-width:1000px;margin:0 auto 60px;padding:22px 18px 0;
  background:repeating-linear-gradient(90deg,#3a2414 0 6px,#33200f 6px 11px,#3f2817 11px 19px);
  border:14px solid #5a3a22;border-bottom-width:0;border-radius:6px 6px 0 0;
  box-shadow:inset 0 0 70px #000,0 10px 40px #000}
.row{display:flex;align-items:flex-end;gap:2px;padding:0 10px;min-height:200px}
.plank{height:20px;margin:0 -18px;position:relative;
  background:linear-gradient(#a8754a,#7a4e2c 18%,#5e3a20 60%,#3c2412);
  box-shadow:0 10px 16px #000b}
.plank::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,#0000 0 37px,#0003 37px 39px,#0000 39px 91px,#fff1 91px 92px)}
.book{height:var(--h);width:var(--w);background:linear-gradient(90deg,#0006,#0000 14%,#ffffff22 48%,#0000 86%,#0007),var(--c);
  color:#f3e9d2;border:0;border-radius:2px 2px 0 0;cursor:pointer;padding:12px 0;overflow:hidden;
  writing-mode:vertical-rl;font:600 12px Georgia,serif;letter-spacing:.5px;
  box-shadow:inset 0 0 0 1px #0004,2px 0 4px #0008;transition:transform .18s}
.book:hover,.book:focus-visible{transform:translateY(-12px);outline:none}
.book small{font-weight:normal;opacity:.7;margin-top:10px}
.book.locked{cursor:default}
#reader{position:fixed;inset:0;z-index:50;background:#f4ecd8;color:#2a1a0c}
#reader[hidden]{display:none}
#bar{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(#6b4428,#4a2d19);color:#f3e9d2}
#bar button{background:#0003;color:inherit;border:1px solid #fff3;border-radius:4px;font-size:18px;padding:4px 12px;cursor:pointer}
#ttl{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#view{position:absolute;top:48px;bottom:0;left:0;right:0;overflow:auto;text-align:center}
#view canvas{max-width:100%}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:6px;display:none;z-index:60}
</style>
</head>
<body>
<h1>BOOKS I'VE READ</h1>
<div id="count"></div>
<div id="shelf"></div>

<div id="reader" hidden>
  <div id="bar">
    <button id="prev" aria-label="Previous">&lsaquo;</button>
    <button id="next" aria-label="Next">&rsaquo;</button>
    <span id="ttl"></span><span id="pos"></span>
    <button id="close" aria-label="Close">&times;</button>
  </div>
  <div id="view"></div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const PAL = ['#7a1f1f','#1f3d5c','#2f4a2b','#5a3b1e','#3b2a52','#8a6a1c','#22454a','#6b2c3e'];
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
let books = [], go = () => {}, cleanup = () => {};

fetch('books.json').then(r => r.json()).then(b => { books = b; render(); })
  .catch(() => { $('#count').textContent = 'Could not load books.json'; });
let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(render, 150); });

function render() {
  const shelf = $('#shelf'), max = shelf.clientWidth - 56;
  const rows = [[]]; let used = 0;
  books.forEach((b, i) => {
    const h = hash(b.title), w = 34 + (h >> 3) % 22, ht = 150 + h % 45;
    if (used + w + 2 > max && rows.at(-1).length) { rows.push([]); used = 0; }
    used += w + 2;
    rows.at(-1).push({ b, i, w, ht, c: b.color || PAL[h % PAL.length] });
  });
  shelf.innerHTML = rows.map(r =>
    '<div class="row">' + r.map(({ b, i, w, ht, c }) =>
      `<button class="book${b.file ? '' : ' locked'}" data-i="${i}" style="--w:${w}px;--h:${ht}px;--c:${c}"
        title="${esc(b.title)}${b.author ? ' - ' + esc(b.author) : ''}">${esc(b.title)}${b.author ? '<small>' + esc(b.author) + '</small>' : ''}</button>`
    ).join('') + '</div><div class="plank"></div>').join('');
  $('#count').textContent = books.length + ' books';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

$('#shelf').addEventListener('click', e => {
  const el = e.target.closest('.book'); if (!el) return;
  const b = books[+el.dataset.i];
  if (!b.file) return toast('Not available to read online');
  openBook(b);
});

function toast(m) {
  const el = $('#toast'); el.textContent = m; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2000);
}

async function openBook(b) {
  $('#reader').hidden = false; $('#ttl').textContent = b.title; $('#pos').textContent = '';
  document.body.style.overflow = 'hidden';
  try {
    if (b.file.toLowerCase().endsWith('.pdf')) await openPdf(b); else await openEpub(b);
  } catch (err) {
    console.error(err);
    $('#view').textContent = 'Could not open this book.';
  }
}

async function openEpub(b) {
  const book = ePub(b.file, { openAs: 'epub' });
  const r = book.renderTo('view', { width: '100%', height: '100%', flow: 'paginated', spread: 'none' });
  const key = 'pos:' + b.file;
  await r.display(store.get(key) || undefined);
  r.on('relocated', l => store.set(key, l.start.cfi));
  go = d => d > 0 ? r.next() : r.prev();
  cleanup = () => book.destroy();
}

async function openPdf(b) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument(b.file).promise;
  const key = 'pos:' + b.file, view = $('#view');
  let n = Math.min(doc.numPages, +store.get(key) || 1);
  const canvas = document.createElement('canvas'); view.appendChild(canvas);
  const draw = async () => {
    const p = await doc.getPage(n), dpr = devicePixelRatio || 1;
    const base = p.getViewport({ scale: 1 });
    const scale = Math.min(view.clientWidth / base.width, 1.6);
    const v = p.getViewport({ scale: scale * dpr });
    canvas.width = v.width; canvas.height = v.height;
    canvas.style.width = v.width / dpr + 'px';
    await p.render({ canvasContext: canvas.getContext('2d'), viewport: v }).promise;
    $('#pos').textContent = n + ' / ' + doc.numPages;
    view.scrollTop = 0; store.set(key, n);
  };
  go = d => { n = Math.max(1, Math.min(doc.numPages, n + d)); draw(); };
  cleanup = () => doc.destroy();
  await draw();
}

function closeReader() {
  cleanup(); cleanup = () => {}; go = () => {};
  $('#view').innerHTML = ''; $('#reader').hidden = true;
  document.body.style.overflow = '';
}
$('#close').onclick = closeReader;
$('#next').onclick = () => go(1);
$('#prev').onclick = () => go(-1);
addEventListener('keydown', e => {
  if ($('#reader').hidden) return;
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'Escape') closeReader();
});
</script>
</body>
</html>
